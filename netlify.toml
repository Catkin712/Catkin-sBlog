[build]
    command = "npm run build"
    publish = "dist"
    functions = "netlify/functions"

[build.environment]
    NODE_VERSION = "22.23.1"

[functions]
    node_bundler = "esbuild"
    included_files = ["netlify/seed/catkinsblog.sqlite.enc", "netlify/seed/uploads/**"]

[[headers]]
    for = "/_astro/*"
    [headers.values]
        cache-control = "public, max-age=31536000, immutable"
